services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: service-template-api:local
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=service_template;Username=postgres;Password=postgres
      ApiKeyAuth__HeaderName: X-Api-Key
      ApiKeyAuth__ApiKey: dev
      Database__ApplyMigrationsOnStartup: "true"
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: service_template
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d service_template"]
      interval: 5s
      timeout: 3s
      retries: 20

